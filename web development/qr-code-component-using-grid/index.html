<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-CODE</title>
  <link rel="stylesheet" href="qr.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <section class="container">
      <div class="qr-container">
        <img class="qr-code" src="image-qr-code.png">
      </div>
      <div class="text">
      <p class="description">Improve your front-end skills by building projects</p>
      <p class="instructions">Scan the QR code to visit Frontend Mentor and take you coding skills to the next level</p>
      </div>
    </section>
  </main>
  
</body>
</html>
